name: Build ToolBox
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - run: gradle :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ToolBox-Android-APK
          path: app/build/outputs/apk/release/*.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - run: gradle :desktop:createDistributable --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ToolBox-PC-portable
          path: desktop/build/compose/binaries/main/app/ToolBox
      - run: gradle :desktop:packageMsi --no-daemon
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: ToolBox-PC-installer
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: ignore
