name: Build ToolBox
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - run: gradle :app:assembleRelease -PvCode=${{ github.run_number }} --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ToolBox-Android-APK
          path: app/build/outputs/apk/release/*.apk
      - name: Publish rolling release (for in-app updates)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd app/build/outputs/apk/release
          cp *arm64-v8a*.apk ToolBox-arm64-v8a.apk
          cp *armeabi-v7a*.apk ToolBox-armeabi-v7a.apk
          S1=$(stat -c%s ToolBox-arm64-v8a.apk); S2=$(stat -c%s ToolBox-armeabi-v7a.apk)
          echo "{\"versionCode\":${{ github.run_number }},\"versionName\":\"1.0.${{ github.run_number }}\",\"arm64\":$S1,\"armv7\":$S2}" > update.json
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ToolBox-arm64-v8a.apk ToolBox-armeabi-v7a.apk update.json --title "ToolBox latest (build ${{ github.run_number }})" --notes "Automatic build ${{ github.sha }}" --target ${{ github.sha }}
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - run: gradle :desktop:createDistributable --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ToolBox-PC-portable
          path: desktop/build/compose/binaries/main/app/ToolBox
      - run: gradle :desktop:packageMsi --no-daemon
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: ToolBox-PC-installer
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: ignore
