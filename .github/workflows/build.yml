name: Build ToolBox
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - run: gradle :app:assembleRelease -PvCode=${{ github.run_number }} --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ToolBox-Android-APK
          path: app/build/outputs/apk/release/*.apk
      - name: Publish rolling release (full APKs + delta patches for in-app updates)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq bsdiff
          mkdir -p out prev
          cp app/build/outputs/apk/release/*arm64-v8a*.apk out/ToolBox-arm64-v8a.apk
          cp app/build/outputs/apk/release/*armeabi-v7a*.apk out/ToolBox-armeabi-v7a.apk
          gh release download latest --dir prev --pattern 'ToolBox-*.apk' --pattern 'update.json' || true
          python3 tools/mkupdate.py ${{ github.run_number }} out prev
          shopt -s nullglob
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest out/*.apk out/patch-*.bin --clobber
            gh release upload latest out/update.json --clobber
            gh release edit latest --title "ToolBox latest (build ${{ github.run_number }})"
            for a in $(gh release view latest --json assets -q '.assets[].name'); do
              case "$a" in patch-*) grep -qx "$a" out/keep.txt || gh release delete-asset latest "$a" -y ;; esac
            done
          else
            gh release create latest out/*.apk out/patch-*.bin out/update.json --title "ToolBox latest (build ${{ github.run_number }})" --notes "Automatic build" --target ${{ github.sha }}
          fi
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - run: gradle :desktop:createDistributable --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ToolBox-PC-portable
          path: desktop/build/compose/binaries/main/app/ToolBox
      - run: gradle :desktop:packageMsi --no-daemon
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: ToolBox-PC-installer
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: ignore
